name: Update Tady Vary calendar

on:
  schedule:
    - cron: "0 6 * * 1" # pondělí 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate, commit and push (retry on race with other pushes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_calendar.py
            git add docs/tadyvary.ics
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Update showtimes from kino35.ifp.cz"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying after resync..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1
